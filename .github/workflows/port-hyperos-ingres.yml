name: Port HyperOS -> ingres

# Port HyperOS (mis. HyperOS 3/4) dari HP Xiaomi lain ke ingres, base = HyperOS 2 stock ingres
# (OS2.0.5.0.ULJCNXM, Android 14). Prosesnya sama dengan "Port MIUI 14 / HyperOS -> ingres"
# (port-miui-ingres.yml, toolkit toraidl/hyperos_port + tambalan), hanya default-nya berbeda.
# Kernel custom (default: kernel D2N 5.10.271-gki-MIX) dicek otomatis terhadap modul vendor
# HyperOS 2: dipakai hanya kalau CRC simbolnya cocok, kalau tidak kernel stock HyperOS 2 dipakai.

on:
  workflow_dispatch:
    inputs:
      base_rom_url:
        description: "URL ROM base ingres: default HyperOS 2 stock ingres OS2.0.5.0.ULJCNXM (Android 14, OTA payload.bin). Versi Android base harus <= donor"
        required: true
        default: "https://cdnorg.d.miui.com/OS2.0.5.0.ULJCNXM/ingres-ota_full-OS2.0.5.0.ULJCNXM-user-14.0-f4c2771903.zip"
        type: string
      port_rom_url:
        description: "URL ROM donor HyperOS (.zip OTA payload.bin, zip gaya xiaomi.eu, atau fastboot .tgz). Ideal: SM8450/SM8475 (marble, diting, cupid, mayfly)"
        required: true
        type: string
      boot_img_url:
        description: "URL boot.img kernel custom (default: kernel D2N 5.10.271-gki-MIX). Dicek otomatis vs modul vendor base: tidak cocok = kernel stock dipakai. Kosong = kernel stock"
        required: false
        default: "https://github.com/kingD2N/ALL-PROJECT-D2N/releases/download/TES/boot.img"
        type: string
      repack_ext4:
        description: "Partisi port dibangun EXT4 (bisa mount rw). false = ikut filesystem base (EROFS)"
        required: false
        default: true
        type: boolean
      remove_encryption:
        description: "Matikan enkripsi data (butuh Format Data saat flash)"
        required: false
        default: false
        type: boolean
      upload_release:
        description: "Unggah hasil ke GitHub Release, selain artifact"
        required: false
        default: false
        type: boolean

jobs:
  port:
    permissions:
      contents: write
    uses: ./.github/workflows/port-miui-ingres.yml
    with:
      base_rom_url: ${{ inputs.base_rom_url }}
      port_rom_url: ${{ inputs.port_rom_url }}
      boot_img_url: ${{ inputs.boot_img_url }}
      repack_ext4: ${{ inputs.repack_ext4 }}
      remove_encryption: ${{ inputs.remove_encryption }}
      upload_release: ${{ inputs.upload_release }}
      title: "Port HyperOS -> ingres"
